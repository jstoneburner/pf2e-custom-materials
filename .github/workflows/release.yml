name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches module.json version
        run: |
          MODULE_VERSION=$(jq -r .version module.json)
          TAG_VERSION="${GITHUB_REF_NAME}"
          if [ "$MODULE_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match module.json version $MODULE_VERSION"
            exit 1
          fi

      - name: Build module archive
        run: zip -r pf2e-custom-materials.zip module.json scripts lang styles templates LICENSE README.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            module.json
            pf2e-custom-materials.zip
